<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Karla:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="index.css">
    </head>
    <button id="theme-toggle">Toggle Dark Mode</button>
    <body class="light-theme">
        <div class="container">
            <h1>Generate a 
            <br>
            <span>random password</span></h1>
            <p>Never use an insecure password again.</p>

            <!-- button and password composition -->
            <button id="generate-btn">Generate passwords</button>
            <section class="composition">
                <label for="length-input">
                <input type="number" id="length-input" min="4" max="15" value="15"> Password Length (4-15)</label>
                <label for="symbols-box">
                <input type="checkbox" id="symbols-box" checked> Symbols (ex: !, @, #, $)</label>
                <label for="numbers-box">
                <input type="checkbox" id="numbers-box" checked> Numbers (0-9)</label>
            </section>

            <hr>
            <label for="passwords">Passwords:</label>
            <div class="passwords">
                <input id="password1" placeholder="P4$$w0rd-1"></input>
                <input id="password2" placeholder="p455w0rD_2"></input>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>

<!-- Requirements:
 1. build from "scratch"
 2. generate two random passwords when the user clicks the button
 3. each password should be 15 characters long
-->
